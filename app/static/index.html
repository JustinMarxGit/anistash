<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AniStash">
  <title>AniStash</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" id="favicon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- Line icons, used as <svg class="i"><use href="#i-name"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-browse" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="9" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.8"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.8"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.8"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="m7 10 5 5 5-5"/><path d="M4.5 19.5h15"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="6.5" rx="2"/><rect x="3.5" y="13" width="17" height="6.5" rx="2"/><path d="M7 7.75h.01M7 16.25h.01"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m6.5 10.5 5.5-5.5 5.5 5.5"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m6.5 13.5 5.5 5.5 5.5-5.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5V9H15"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.7 9 19.5 10.5 13.7 12 12 17.5 10.3 12 4.5 10.5 10.3 9z"/><path d="M18.5 16.5v4M16.5 18.5h4"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="11.5" rx="2"/><path d="M9 20.5h6M12 17v3.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 21 19.5H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.2 8.8-2 4.4-4.4 2 2-4.4z"/></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01" stroke-width="2.6"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.2A7.8 7.8 0 0 1 9.8 4.5a7.8 7.8 0 1 0 9.7 9.7z"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.3 0 1.9-.9 1.6-2-.3-1.2.4-2.4 1.7-2.4h1.9a3.3 3.3 0 0 0 3.3-3.3C20.5 7.6 16.7 3.5 12 3.5z"/><path d="M7.6 11.2h.01M10 7.6h.01M14.4 7.6h.01" stroke-width="2.6"/></symbol>
      <!-- The seal logo, drawn in each person's accent colour -->
      <symbol id="logo" viewBox="0 0 104 104">
        <rect width="104" height="104" rx="26" style="fill: var(--accent)"/>
        <rect x="7" y="7" width="90" height="90" rx="20" style="fill: none; stroke: var(--accent-text); stroke-opacity: .38; stroke-width: 2.5"/>
        <path d="M29 33.5H75.5Q72 45.5 57.5 55" style="fill: none; stroke: var(--accent-text); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round"/>
        <path d="M50.5 46Q51.5 66.5 33 79" style="fill: none; stroke: var(--accent-text); stroke-width: 10; stroke-linecap: round"/>
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.4"/><path d="M2.8 19.5a6.2 6.2 0 0 1 12.4 0"/><path d="M15.5 5.4a3.3 3.3 0 0 1 0 6.3M17.5 13.6a6.2 6.2 0 0 1 3.7 5.9"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6M12 16.6h.01"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="AniStash home">
      <svg class="logo" width="30" height="30" aria-hidden="true"><use href="#logo"/></svg>
      <span>anistash</span>
    </a>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark"></button>
    <div class="langswitch" id="langswitch" role="group" aria-label="Show titles in" hidden>
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">JA</button>
    </div>
    <nav class="nav" id="nav" hidden>
      <span class="nav-ind" aria-hidden="true"></span>
      <a href="#/" data-nav="browse"><svg class="i"><use href="#i-browse"/></svg><span>Browse</span></a>
      <a href="#/discover" data-nav="discover"><svg class="i"><use href="#i-compass"/></svg><span>Discover</span></a>
      <a href="#/search" data-nav="search"><svg class="i"><use href="#i-search"/></svg><span>Search</span></a>
      <a href="#/downloads" data-nav="downloads"><svg class="i"><use href="#i-download"/></svg><span>Downloads</span><b class="badge" id="queue-badge" hidden></b></a>
      <a href="#/settings" data-nav="settings"><svg class="i"><use href="#i-settings"/></svg><span>Settings</span></a>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view" aria-live="polite"></main>
  <div id="toasts" class="toasts" role="status"></div>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
